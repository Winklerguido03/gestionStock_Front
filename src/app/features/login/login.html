<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISTRIBUIDORA - Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>

    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">

    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-4">
        <a class="navbar-brand fw-bold" href="login.html">
          <i class="bi bi-box-seam me-2"></i> DISTRIBUIDORA
        </a>
      </nav>
    </header>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 py-5">
      <div class="card shadow p-4 w-100" style="max-width: 400px; border-radius: 10px;">
        
        <div class="text-center mb-4">
          <h2 class="fw-bold text-secondary fs-4">INICIAR SESIÓN</h2>
          <p class="text-muted small">Gestión de Stock</p>
        </div>

        <form action="sesion" method="POST">
          
          <div class="mb-3">
            <label for="txtUsername" class="form-label fw-semibold">NOMBRE DE USUARIO</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" name="txtUsername" id="txtUsername" placeholder="Admin123" required />
            </div>
          </div>

          <div class="mb-4">
            <label for="txtPass" class="form-label fw-semibold">CONTRASEÑA</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" name="txtPass" id="txtPass" placeholder="Contraseña" required />
            </div>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg shadow-sm">Ingresar</button>
          </div>

        </form>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
